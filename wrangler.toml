name = "paking-int2-worker"
main = "src/server/index.ts"
compatibility_date = "2024-10-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "supersecret_jwt_key_local_development"

[[d1_databases]]
binding = "PARKING_DB"
database_name = "paking-db"
database_id = "local-d1-paking-db"
migrations_dir = "src/server/db/migrations"

[site]
bucket = "./dist"
