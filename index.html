<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Sistema Inteligente de Gestión y Asignación Dinámica de Estacionamientos - PWA Offline-First" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#4f46e5" />
    <title>Smart Parking - Gestión Inteligente de Estacionamientos</title>
    <script>
      (() => {
        const key = "smart-parking-theme";
        try {
          const preference = localStorage.getItem(key);
          const valid = preference === "light" || preference === "dark" || preference === "system";
          const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = valid && preference !== "system" ? preference : systemDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "dark" ? "#0b1020" : "#f5f7fb";
        } catch {
          const theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
