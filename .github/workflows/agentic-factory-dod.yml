name: Agentic Software Factory - DoD Verification

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify-dod:
    name: Definition of Done quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject unresolved TODO and FIXME markers
        run: |
          if git grep -E '(TODO|FIXME):' -- 'specs/' 'src/' 'history/' 2>/dev/null; then
            echo 'Unresolved TODO or FIXME markers violate the repository Definition of Done.'
            exit 1
          fi

      - name: Verify repository constitution
        run: test -f .specify/memory/constitution.md

      - name: Test with required coverage
        run: npm run test:coverage

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit

      - name: Build application
        run: npm run build

      - name: Package Worker and Static Assets without deploying
        run: npm run worker:dry-run
